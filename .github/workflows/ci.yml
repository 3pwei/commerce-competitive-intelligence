name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest --cov=competitive_intelligence --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Dependency vulnerability scan
        run: python -m pip_audit .
      - name: Offline end-to-end demo
        env:
          NO_PROXY: "*"
        run: python -m competitive_intelligence demo-run --mode fixture --provider mock --output-dir output/ci
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
