name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest --cov=competitive_intelligence --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Dependency vulnerability scan
        run: python -m pip_audit .
      - name: Offline end-to-end demo
        env:
          NO_PROXY: "*"
        run: python -m competitive_intelligence demo-run --mode fixture --provider mock --output-dir output/ci
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  n8n-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build pinned n8n 2.x runtime
        run: docker compose build --pull n8n-smoke
      - name: Prepare Demo output mount
        run: mkdir -p output/n8n && chmod 0777 output/n8n
      - name: Execute imported workflow in n8n runtime
        run: docker compose --profile test run --rm n8n-smoke
      - name: Start n8n and verify persisted workflow
        run: |
          docker compose up -d n8n
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5678/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5678/healthz
          docker compose restart n8n
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5678/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5678/healthz
          docker compose exec -T n8n n8n list:workflow | grep competitive-intelligence-demo-v2
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: n8n-runtime-evidence
          path: output/n8n/
      - name: Runtime logs
        if: failure()
        run: docker compose logs --no-color n8n
