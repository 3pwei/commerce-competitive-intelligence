name: commerce-competitive-intelligence

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: commerce-competitive-intelligence-n8n:2.4.4
    ports:
      - "5678:5678"
    environment: &n8n-environment
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: "/demo-output"
      # n8n 2.x excludes Execute Command by default. Enable only the two local
      # file/process nodes required by this Demo while keeping Local File Trigger disabled.
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      TZ: "Asia/Taipei"
      GENERIC_TIMEZONE: "Asia/Taipei"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./output/n8n:/demo-output
    restart: unless-stopped

  n8n-smoke:
    profiles: ["test"]
    image: commerce-competitive-intelligence-n8n:2.4.4
    build:
      context: .
      dockerfile: Dockerfile.n8n
    environment: *n8n-environment
    volumes:
      - n8n_data:/home/node/.n8n
      - ./output/n8n:/demo-output
    entrypoint: ["/bin/sh", "/opt/competitive-intelligence/scripts/n8n-runtime-smoke.sh"]

volumes:
  n8n_data:
